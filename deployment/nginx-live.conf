# Copy of the LIVE config: /etc/nginx/sites-available/satoshistacks on the production
# server, fetched 2026-11-18 after rate limits, landing-page headers and deny rules were
# applied. This is a record, not the source: the server's file is what runs. If you
# change the server's file, replace this copy. nginx-config.template is an older
# starting point for a fresh install and does not match production.

server {
    server_name satoshistacks.com www.satoshistacks.com _;

    # ─── Table routes (/station100, /playmoney) + legacy /pond,/table-1 -> app redirect ───────────────────────
    location ~ ^/(station100)$ {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Socket.IO needs its own location for WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://localhost:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:3001/health;
    }

    # NIP-05 NOSTR identifier verification
    location /.well-known/ {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://localhost:3001/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin dashboard
    location /admin {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://localhost:3001/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OG image for social sharing
    location = /og-image.png {
        root /opt;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|webmanifest)$ {
        # A first visit loads many files at once; keep this burst generous.
        limit_req zone=general burst=200 nodelay;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Landing page (everything else)
    location / {
        limit_req zone=general burst=50 nodelay;
        root /opt;
        try_files /coming-soon.html =404;
        # A location with its own add_header drops the server-level ones, so
        # the full set is repeated here. The app sets its own on proxied pages.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Never answer for dotfiles or common exploit probes (regex locations win
    # over the prefix rules above; /.well-known/ is not matched).
    location ~ /\.(git|env|htaccess|htpasswd|svn|DS_Store) {
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|administrator) {
        return 404;
    }

    # Rate-limited requests get 429 (Too Many Requests), not the default 503.
    limit_req_status 429;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/satoshistacks.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/satoshistacks.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.satoshistacks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = satoshistacks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name satoshistacks.com www.satoshistacks.com _;
    return 404; # managed by Certbot




}
